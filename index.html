<!DOCTYPE html>
<html lang="en">
<head>

    <title>Student Score Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

    <div class="container">

                    <td class="grade">F</td>
                </tr>
